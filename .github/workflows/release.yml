name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate tag against Gradle version metadata
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          GRADLE_FILE=android/app/build.gradle.kts

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Tag '$TAG' must look like vX.Y.Z or vX.Y.Z-<pre-release> (e.g. v0.1.0)."
            exit 1
          fi

          VERSION_NAME=$(sed -n -E 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' "$GRADLE_FILE")
          VERSION_CODE=$(sed -n -E 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' "$GRADLE_FILE")
          echo "Tag: $TAG | versionName: $VERSION_NAME | versionCode: $VERSION_CODE"

          if [ "v${VERSION_NAME}" != "$TAG" ]; then
            echo "::error::Tag '$TAG' does not match versionName '$VERSION_NAME' in $GRADLE_FILE (expected tag 'v$VERSION_NAME')."
            exit 1
          fi
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not parse versionCode from $GRADLE_FILE."
            exit 1
          fi

          CHANGELOG_FILE="CHANGELOG.md"
          VERSION="${TAG#v}"
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "::warning::$CHANGELOG_FILE not found; releasing without a Highlights section."
          else
            HAS_ENTRY=$(awk -v ver="$VERSION" '
              { sub(/\r$/, "") }
              /^##[[:space:]]+/ {
                if (in_section) exit
                heading = $0
                sub(/^##[[:space:]]+/, "", heading)
                sub(/[[:space:]].*$/, "", heading)
                sub(/\]\(.*\)$/, "]", heading)
                sub(/^\\\[/, "[", heading)
                sub(/\\\]$/, "]", heading)
                gsub(/^\[|\]$/, "", heading)
                sub(/^v/, "", heading)
                if (heading == ver) {
                  in_section = 1
                  next
                }
              }
              in_section && /^\[[^]]+\]:[[:space:]]+/ { next }
              in_section && $0 !~ /^[[:space:]]*$/ { found = 1; exit }
              END { if (found) print "yes" }
            ' "$CHANGELOG_FILE")
            if [ -z "$HAS_ENTRY" ]; then
              echo "::warning::No non-empty entry for $VERSION in $CHANGELOG_FILE; releasing without a Highlights section."
            fi
          fi

  build-android:
    needs: validate-version
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: "21"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-root-directory: android

      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-unit-test-results
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/

      - name: Validate signing secrets
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"

      - name: Decode keystore
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/android-release-signing.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_SIGNING_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect release APKs
        run: |
          set -euo pipefail
          mapfile -t apks < <(find android/app/build/outputs/apk -type f -path '*/release/*.apk' | sort)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK files were produced."
            exit 1
          fi

          if find android/app/build/outputs/apk -type f -path '*/release/*unsigned*.apk' | grep -q .; then
            echo "Unsigned APKs were found in release outputs."
            find android/app/build/outputs/apk -type f -path '*/release/*unsigned*.apk'
            exit 1
          fi

          mkdir -p release-assets
          for apk in "${apks[@]}"; do
            filename=$(basename "$apk")
            cp "$apk" "release-assets/$filename"
          done

      - name: Collect and compress release mapping
        run: |
          set -euo pipefail
          mapfile -t mappings < <(find android/app/build/outputs/mapping/release -type f -name 'mapping.txt')
          if [ ${#mappings[@]} -eq 0 ]; then
            echo "No mapping.txt file found."
            exit 1
          fi
          echo "Found mapping file: ${mappings[0]}"
          gzip -9 -n -c "${mappings[0]}" > release-assets/mapping.txt.gz

      - name: Upload Android release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-android-assets
          path: release-assets/
          if-no-files-found: error

      - name: Remove signing keystore
        if: always()
        run: |
          if [ -n "${ANDROID_SIGNING_KEYSTORE_FILE:-}" ] && [ -f "$ANDROID_SIGNING_KEYSTORE_FILE" ]; then
            shred -u "$ANDROID_SIGNING_KEYSTORE_FILE" || rm -f "$ANDROID_SIGNING_KEYSTORE_FILE"
          fi

  build-linux:
    needs: validate-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: linux/go.mod

      - name: Run go vet
        working-directory: linux
        run: go vet ./...

      - name: Run tests
        working-directory: linux
        run: go test -v -race ./...

      - name: Build Linux release archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for arch in amd64 arm64; do
            stage_dir="$RUNNER_TEMP/bluehop-${TAG}-linux-${arch}"
            rm -rf "$stage_dir"
            mkdir -p "$stage_dir"
            (
              cd linux
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
                -trimpath \
                -ldflags "-s -w -X main.version=${TAG}" \
                -o "${stage_dir}/bluehop" \
                ./cmd/bluehop
            )
            chmod 0755 "${stage_dir}/bluehop"
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -C "$stage_dir" -cf - bluehop \
              | gzip -9 -n > "release-assets/bluehop-${TAG}-linux-${arch}.tar.gz"
          done

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-assets
          path: release-assets/
          if-no-files-found: error

  publish-release:
    needs: [validate-version, build-android, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Android release assets
        uses: actions/download-artifact@v8
        with:
          name: release-android-assets
          path: release-assets

      - name: Download Linux release assets
        uses: actions/download-artifact@v8
        with:
          name: release-linux-assets
          path: release-assets

      - name: Collect assets and generate SHA256 checksums
        id: collect_assets
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find release-assets -maxdepth 1 -type f \( -name '*.apk' -o -name '*.tar.gz' \) | sort)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No release artifacts were found."
            exit 1
          fi
          if ! find release-assets -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "No Android APK artifacts were found."
            exit 1
          fi
          if ! find release-assets -maxdepth 1 -type f -name '*.tar.gz' | grep -q .; then
            echo "No Linux archive artifacts were found."
            exit 1
          fi
          test -f release-assets/mapping.txt.gz

          (
            cd release-assets
            find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.tar.gz' \) -printf '%f\n' \
              | sort \
              | xargs sha256sum > SHA256SUMS.txt
          )
          cat release-assets/SHA256SUMS.txt

          {
            echo "files<<EOF"
            printf '%s\n' "${artifacts[@]}"
            echo "release-assets/SHA256SUMS.txt"
            echo "release-assets/mapping.txt.gz"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_BODY_FILE="$RUNNER_TEMP/release-body.md"
          CHANGELOG_FILE="CHANGELOG.md"
          VERSION="${TAG#v}"

          BASE_TAG="${TAG%%-*}"
          STABLE_TAGS=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName')
          PREV_STABLE_TAG=$(printf '%s\n' "$STABLE_TAGS" "$BASE_TAG" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -u -V \
            | awk -v base="$BASE_TAG" '$0 == base { exit } { last = $0 } END { print last }')

          notes_args=(-f tag_name="$TAG")
          if [ -n "$PREV_STABLE_TAG" ]; then
            echo "Generating release notes for $TAG against previous stable release $PREV_STABLE_TAG"
            notes_args+=(-f previous_tag_name="$PREV_STABLE_TAG")
          else
            echo "::warning::No previous stable release found; GitHub will pick the comparison base."
          fi
          GENERATED_NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" "${notes_args[@]}" --jq '.body')

          HIGHLIGHTS=""
          if [ -f "$CHANGELOG_FILE" ]; then
            HIGHLIGHTS=$(awk -v ver="$VERSION" '
              { sub(/\r$/, "") }
              /^##[[:space:]]+/ {
                if (in_section) exit
                heading = $0
                sub(/^##[[:space:]]+/, "", heading)
                sub(/[[:space:]].*$/, "", heading)
                sub(/\]\(.*\)$/, "]", heading)
                sub(/^\\\[/, "[", heading)
                sub(/\\\]$/, "]", heading)
                gsub(/^\[|\]$/, "", heading)
                sub(/^v/, "", heading)
                if (heading == ver) {
                  in_section = 1
                  next
                }
              }
              in_section && /^\[[^]]+\]:[[:space:]]+/ { next }
              in_section {
                if (!started && $0 ~ /^[[:space:]]*$/) next
                started = 1
                lines[++n] = $0
              }
              END {
                while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
                for (i = 1; i <= n; i++) print lines[i]
              }
            ' "$CHANGELOG_FILE")
          fi

          {
            if [ -n "$HIGHLIGHTS" ]; then
              echo "Using changelog section for $VERSION from $CHANGELOG_FILE" >&2
              echo "## Highlights"
              echo ""
              printf '%s\n\n' "$HIGHLIGHTS"
            fi
            printf '%s\n' "$GENERATED_NOTES"
          } > "$RELEASE_BODY_FILE"
          echo "path=$RELEASE_BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: BlueHop ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          body_path: ${{ steps.changelog.outputs.path }}
          files: |
            ${{ steps.collect_assets.outputs.files }}

  update-stable:
    needs: publish-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fast-forward stable branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          COMMIT_SHA=$(git rev-parse 'HEAD^{commit}')
          rc=0
          git ls-remote --exit-code --heads origin stable >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --no-tags origin refs/heads/stable:refs/remotes/origin/stable
            if ! git merge-base --is-ancestor origin/stable "$COMMIT_SHA"; then
              echo "::error::Cannot fast-forward origin/stable to $TAG ($COMMIT_SHA) because origin/stable is not an ancestor."
              exit 1
            fi
          elif [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          git push origin "${COMMIT_SHA}:refs/heads/stable"
