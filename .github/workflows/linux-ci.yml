name: Linux CI

on:
  push:
    branches:
      - master
    paths:
      - "linux/**"
      - "protocol/**"
      - ".github/workflows/linux-ci.yml"
  pull_request:
    paths:
      - "linux/**"
      - "protocol/**"
      - ".github/workflows/linux-ci.yml"

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: linux/go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Build binary
        run: |
          go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/bluehop-amd64" ./cmd/bluehop
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o "$RUNNER_TEMP/bluehop-arm64" ./cmd/bluehop
